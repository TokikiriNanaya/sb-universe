# 300英雄宅基地自动任务配置文件

# ==================== 账号配置 ====================

# 在 accounts 可列表中添加多个账号，每个账号包含 name 和 token
accounts:
  - name: "账号1" # 账号备注自行修改 用于多账号下方便区分
    token: "这里填写你的token"

  # 添加更多账号示例（取消注释并填写token即可）
  # - name: "账号2"
  #   token: "第二个账号的token"
  # - name: "账号3"
  #   token: "第三个账号的token"


# ==================== 全局配置 ====================

# API基础URL (一般不需要修改)
api_base_url: "https://300zjd.tygms.cn/"

# 月度累计签到奖励ID (3天/7天/15天/28天)
monthly_signin_task_ids: [2001, 2002, 2003, 2004]

# 请求间隔时间(秒),避免频繁请求
request_delay: 1.0

# 账号间延迟时间(秒)，多账号切换时的延迟
account_delay: 5.0

# 请求超时时间(秒)
timeout: 30

# 最大重试次数 (网络请求/发帖/浏览失败时重试)
max_retries: 3

# 重试间隔时间(秒)
retry_delay: 5.0
