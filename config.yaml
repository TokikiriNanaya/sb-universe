# 300英雄宅基地自动任务配置文件

# 必填: 用户Token (获取方法见README.md)
token: "你的Token"

# API基础URL (一般不需要修改)
api_base_url: "https://300zjd.tygms.cn/"

# 默认操作的帖子ID
default_post_id: 8403

# 默认关注的用户ID
default_follow_id: "p492210972677771264"

# 要领取奖励的任务ID列表 (默认1-9)
task_ids: [1, 2, 3, 4, 5, 6, 7, 8, 9]

# 请求间隔时间(秒),避免频繁请求
request_delay: 1.0

# 请求超时时间(秒)
timeout: 30

# 最大重试次数(预留功能)
max_retries: 3